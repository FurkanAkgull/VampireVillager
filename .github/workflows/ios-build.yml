name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager integration
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --verbose

      - name: Dump Xcode failure logs
        if: failure()
        run: |
          echo "=== Searching for .xcresult bundles ==="
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcresult" -print 2>/dev/null | while read -r bundle; do
            echo "--- $bundle ---"
            xcrun xcresulttool get --legacy --path "$bundle" --format json 2>&1 | head -c 20000
            echo
          done

          echo "=== Searching for .xcactivitylog files ==="
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcactivitylog" -print 2>/dev/null | while read -r log; do
            echo "--- $log ---"
            gunzip -c "$log" 2>&1 | strings | tail -c 20000
            echo
          done

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r vampir_koylu.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vampir_koylu-ios
          path: vampir_koylu.ipa
          retention-days: 30
